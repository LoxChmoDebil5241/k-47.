name: Публикация игры на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Сборка игры из k47-src
        run: node k47-src/build.mjs --check && node --check k47-src/.tmp/bundle.mjs

      - name: Подготовка сайта
        run: |
          mkdir -p _site
          cp "К-47. Нормы расхода плоти. Цикл-48.html" _site/index.html
          cp "К-47. Нормы расхода плоти. Цикл-48.html" _site/
          cp k47-src/deploy/sw.js _site/sw.js
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
